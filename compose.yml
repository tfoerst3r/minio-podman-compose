services:
  # ============================================================================
  # STORAGE LAYER: MinIO (Data Lake Raw/Curated Buckets & Model Artifacts)
  # ============================================================================
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./secrets/minio.env
    ports:
      - "${API_PORT}:9000"
      - "${WEBUI_PORT}:9001"
    volumes:
      - minio_data:/data
      - minio_mc_config:/root/.mc
      - ./staging:/staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  minio_data:
  minio_mc_config:

